name: Build macOS DMG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Patch build script to use ad-hoc signing
      run: |
        python3 -c "
        with open('build-dmg.sh', 'r') as f:
            content = f.read()
        # Substitui a identidade fixa por assinatura ad-hoc em todo o arquivo
        new_content = content.replace(\"'Tinycast Self-Signed'\", \"-\")
        with open('build-dmg.sh', 'w') as f:
            f.write(new_content)
        "

    - name: Make build script executable
      run: chmod +x build-dmg.sh

    - name: Build DMG
      run: ./build-dmg.sh

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tinycast-DMG
        path: build/*.dmg