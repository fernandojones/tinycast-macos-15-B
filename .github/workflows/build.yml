name: Build macOS DMG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Create and configure build keychain
      run: |
        # Cria um chaveiro customizado temporário com senha vazia
        security create-keychain -p "" build.keychain
        # Adiciona o chaveiro à lista de busca do sistema e o define como padrão
        security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed 's/"//g')
        security unlock-keychain -p "" build.keychain
        security set-keychain-settings -t 3600 -l build.keychain

    - name: Generate and import self-signed certificate
      run: |
        openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 365 -nodes -subj "/CN=Tinycast Self-Signed"
        security import key.pem -k build.keychain -A
        security import cert.pem -k build.keychain -A
        security set-key-partition-list -S apple-todo:,apple: -s -k "" build.keychain
        rm key.pem cert.pem

    - name: Make build script executable
      run: chmod +x build-dmg.sh

    - name: Build DMG
      run: ./build-dmg.sh

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tinycast-DMG
        path: build/*.dmg