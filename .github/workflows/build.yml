name: Build macOS DMG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Remove strict identity check from build script
      run: |
        python3 -c "
        with open('build-dmg.sh', 'r') as f:
            lines = f.readlines()
        # Filtra e remove a linha que valida a identidade de assinatura
        new_lines = [line for line in lines if 'code-signing identity not found' not in line]
        with open('build.sh' if 'build.sh' in 'build-dmg.sh' else 'build-dmg.sh', 'w') as f:
            f.writelines(new_lines)
        "

    - name: Make build script executable
      run: chmod +x build-dmg.sh

    - name: Build DMG
      run: ./build-dmg.sh

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tinycast-DMG
        path: build/*.dmg