name: Build macOS DMG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Bypass strict certificate check and use ad-hoc signing
      run: |
        # Substitui a exigência da identidade 'Tinycast Self-Signed' por assinatura ad-hoc (-)
        sed -i '' "s/'Tinycast Self-Signed'/-/g" build-dmg.sh

    - name: Make build script executable
      run: chmod +x build-dmg.sh

    - name: Build DMG
      run: ./build-dmg.sh

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tinycast-DMG
        path: build/*.dmg