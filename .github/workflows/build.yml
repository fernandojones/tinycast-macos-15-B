name: Build macOS DMG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Import self-signed certificate into login keychain
      run: |
        openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 365 -nodes -subj "/CN=Tinycast Self-Signed"
        security import key.pem -k ~/Library/Keychains/login.keychain-db -A
        security import cert.pem -k ~/Library/Keychains/login.keychain-db -A
        security set-key-partition-list -S apple-todo:,apple: -s -k "" ~/Library/Keychains/login.keychain-db
        rm key.pem cert.pem

    - name: Make build script executable
      run: chmod +x build-dmg.sh

    - name: Build DMG
      run: ./build-dmg.sh

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tinycast-DMG
        path: build/*.dmg